services:
  db:
    image: postgres:16-alpine
    container_name: orbitly-postgres
    environment:
      POSTGRES_DB: orbitly
      POSTGRES_USER: orbitly
      POSTGRES_PASSWORD: orbitly
    ports:
      - "5437:5432"
    volumes:
      - orbitly_pg_data:/var/lib/postgresql/data
      # No initdb scripts: the app's own runMigrations() (server/index.js)
      # creates the schema and seeds festivals on first boot, the same way it
      # would against a fresh production database.
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbitly -d orbitly"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  orbitly_pg_data:
